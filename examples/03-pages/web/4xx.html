{{define "title"}}{{.Status}}{{end}}
<div data-ok-paper data-ok-variant="elevation" data-ok-elevation="1" data-ok-card>
  <div data-ok-card-content>
    <p data-ok-typography data-ok-variant="body2" data-ok-color="textSecondary" data-ok-gutter-bottom>Error {{.Code}}</p>
    <h1 data-ok-typography data-ok-variant="h5">{{.Status}}</h1>
    <div role="alert" data-ok-alert data-ok-severity="error" data-ok-variant="standard" data-ok-color="error">
      <div data-ok-alert-icon><svg data-ok-icon="danger-circle-linear" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="12" cy="12" r="10" /><path d="M12 7V13" /><path stroke-linejoin="round" d="M12 16H12" /></svg></div>
      <div data-ok-alert-message>{{.Message}}</div>
    </div>
    {{with .RequestID}}<p data-ok-typography data-ok-variant="caption" data-ok-color="textSecondary">Request ID: {{.}}</p>{{end}}
  </div>
  <div data-ok-card-actions>
    <a href="/bookings" data-ok-button data-ok-variant="text" data-ok-color="primary" data-ok-size="sm"><span data-ok-button-label>Back to bookings</span></a>
  </div>
</div>
